
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }
        .field { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }
        button {
            padding: 11px 18px;
            background: #3155a4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f3f3f3;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Custom Form Builder</h1>
        <p>The form below is created using JavaScript.</p>

        <div id="formContainer"></div>
    </div>

    <script src="q4.js"></script>
</body>
</html>
