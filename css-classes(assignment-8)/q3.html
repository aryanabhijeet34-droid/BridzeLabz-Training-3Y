<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <div class="container">

        <h1>Box-Sizing Comparison</h1>

        <div class="boxes">

            <div class="box content-box">
                <h2>Content-Box</h2>
                <p>
                    Width applies only to the content.
                    Padding and border are added to the total size.
                </p>
            </div>

            <div class="box border-box">
                <h2>Border-Box</h2>
                <p>
                    Width includes content, padding,
                    and border inside the specified width.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
