<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <div class="container">

        <h1>Combined CSS Effects</h1>

        <div class="effects">

            <button class="effect-btn">
                Hover Me
            </button>

            <button class="effect-btn">
                Click Me
            </button>

            <div class="effect-card">
                <h2>Card</h2>
                <p>Hover over this card</p>
            </div>

            <div class="effect-box">
                Transform
            </div>

        </div>

    </div>

</body>
</html>
