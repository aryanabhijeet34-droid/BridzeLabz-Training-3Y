<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>


    <main>

        <div class="card">

            <div class="image-section">
                <img 
                    src="https://via.placeholder.com/150"
                    alt="Sample Image"
                >
            </div>

            <div class="content">

                <h2>Contact Us</h2>

                <form>

                    <label for="name">Name</label>

                    <input 
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">Email</label>

                    <input 
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <label for="message">Message</label>

                    <textarea 
                        id="message"
                        placeholder="Enter your message"
                    ></textarea>

                    <div class="buttons">

                        <button type="submit">
                            Submit
                        </button>

                        <button type="reset" class="reset">
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <footer>
        <p>© 2026 My Website | All Rights Reserved</p>
    </footer>

</body>
</html>
